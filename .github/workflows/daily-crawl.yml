name: Daily Crawl

on:
  schedule:
    # - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jobetl_user
          POSTGRES_PASSWORD: secure_password_here
          POSTGRES_DB: jobetl
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      DATABASE_URL: postgres://jobetl_user:secure_password_here@localhost:5432/jobetl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup CV Markdown
        run: echo "${{ secrets.CV_MARKDOWN }}" > cv.md

      - name: Push Database Schema
        run: npx drizzle-kit push --force --dialect=postgresql --schema=./src/storage/schema.ts --url=postgres://jobetl_user:secure_password_here@localhost:5432/jobetl

      - name: Hydrate Postgres from Notion
        run: npm run import:notion

      - name: Run crawl pipeline
        run: npm run dev

      - name: Sync Postgres back to Notion
        run: npm run sync:notion
