<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobETL Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="dark"] {
      /* Claude Dark Mode Inspired Palette */
      --bg-base: #1c1b1a;
      --bg-surface: #242322;
      --border-subtle: #363432;
      --border-hover: #484542;
      
      --text-primary: #ebeae8;
      --text-secondary: #a3a19d;
      --text-tertiary: #73716d;
      
      --accent: #d9b89c; /* Soft, muted sand/peach */
      --accent-light: rgba(217, 184, 156, 0.1);
      
      --success: #a3e635;
      --danger: #f43f5e;
      
      --sidebar-width: 280px;
    }

    [data-theme="light"] {
      /* Claude Light Mode Inspired Palette */
      --bg-base: #FAF8F5;
      --bg-surface: #FFFFFF;
      --border-subtle: #E5E3DB;
      --border-hover: #D1CEC2;
      
      --text-primary: #1C1917;
      --text-secondary: #57534E;
      --text-tertiary: #A8A29E;
      
      --accent: #D97757;
      --accent-light: rgba(217, 119, 87, 0.1);
      
      --success: #3F6212;
      --danger: #9F1239;
    }
    
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* Smooth theme transitions for major UI components */
    .main-header, .drawer-header, .metric-card, .list-header, .search-bar input, .job-list, .mobile-job-card {
      transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease;
    }

    /* Focus States for A11y */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Left Navigation Sidebar */
    .nav-sidebar {
      width: var(--sidebar-width);
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), margin-left 0.4s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease;
      flex-shrink: 0;
      z-index: 100;
    }

    body.sidebar-collapsed .nav-sidebar {
      margin-left: calc(var(--sidebar-width) * -1);
    }

    /* Mobile sidebar overlay */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      z-index: 90;
      opacity: 0;
      transition: opacity 0.3s ease;
      cursor: pointer;
    }

    @media (max-width: 1024px) {
      .nav-sidebar {
        position: fixed;
        height: 100vh;
        top: 0; left: 0;
      }
      body.sidebar-collapsed .nav-sidebar {
        transform: translateX(-100%);
        margin-left: 0;
      }
      body:not(.sidebar-collapsed) .nav-sidebar {
        transform: translateX(0);
      }
    }

    .sidebar-header {
      padding: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-family: 'Newsreader', serif;
      font-size: 1.6rem;
      font-weight: 500;
      color: var(--text-primary);
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    .sidebar-actions {
      display: flex;
      gap: 0.25rem;
    }

    .icon-btn {
      background: transparent;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      color: var(--text-primary);
      background: rgba(128,128,128,0.1);
    }

    .sidebar-content {
      padding: 1rem 1.5rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    .nav-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .nav-label {
      font-size: 0.75rem;
      color: var(--text-tertiary);
      margin-bottom: 0.75rem;
      padding-left: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .filter-item {
      padding: 0.6rem 0.75rem;
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transition: all 0.2s ease;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
    }

    .filter-item svg {
      color: var(--text-tertiary);
    }

    .filter-item:hover {
      background-color: rgba(128,128,128,0.05);
      color: var(--text-primary);
    }

    .filter-item.active {
      background-color: var(--accent-light);
      color: var(--accent);
      font-weight: 500;
    }

    .filter-item.active svg {
      color: var(--accent);
    }

    /* Source Checkboxes */
    .source-filter-label {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      font-size: 0.9rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .source-filter-label:hover {
      background-color: rgba(128,128,128,0.05);
      color: var(--text-primary);
    }
    .source-filter-checkbox {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
      cursor: pointer;
      border-radius: 4px;
    }

    /* Main Content Area */
    main {
      flex: 1;
      height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
    }

    .main-header {
      position: sticky;
      top: 0;
      background: var(--bg-base);
      z-index: 50;
      padding: 1.5rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      gap: 1.5rem;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .main-toggle-btn {
      display: none;
    }

    body.sidebar-collapsed .main-toggle-btn {
      display: flex;
    }

    @media (max-width: 1024px) {
      .main-toggle-btn {
        display: flex;
      }
    }

    h1 {
      font-family: 'Newsreader', serif;
      font-size: 2.2rem;
      font-weight: 400;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .search-bar {
      position: relative;
      flex: 1;
      max-width: 360px;
    }

    .search-bar input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 0.6rem 1rem 0.6rem 2.5rem;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    .search-bar input:focus { border-color: var(--text-secondary); }
    .search-bar svg {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary);
    }

    .main-content-inner {
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    /* Metrics Dashboard */
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
    }

    .metric-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .metric-label { font-size: 0.85rem; color: var(--text-secondary); font-weight: 500; }
    .metric-value { font-family: 'Newsreader', serif; font-size: 2.2rem; color: var(--text-primary); }

    /* Data Table / List */
    .job-list {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      overflow: hidden;
    }

    .list-header {
      display: grid;
      grid-template-columns: 80px 3fr 2fr 1fr;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      font-size: 0.75rem;
      color: var(--text-tertiary);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .job-row {
      display: grid;
      grid-template-columns: 80px 3fr 2fr 1fr;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-subtle);
      cursor: pointer;
      align-items: center;
      transition: background 0.15s;
      background: transparent;
      border-top: none; border-left: none; border-right: none;
      width: 100%;
      text-align: left;
    }

    .job-row:last-child { border-bottom: none; }
    .job-row:hover { background: rgba(128,128,128,0.03); }
    .job-row.applied { background: var(--accent-light); opacity: 0.85; }

    .badge-applied {
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--success);
      border: 1px solid var(--success);
      padding: 0.1rem 0.3rem;
      border-radius: 4px;
      text-transform: uppercase;
      margin-left: 0.5rem;
      vertical-align: middle;
    }

    .col-score { font-family: monospace; font-size: 0.95rem; color: var(--text-secondary); }
    .score-high { color: var(--success); font-weight: 600; }

    .col-job { display: flex; flex-direction: column; gap: 0.3rem; min-width: 0; }
    .job-title { font-size: 1rem; font-weight: 500; color: var(--text-primary); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .job-company { font-size: 0.85rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .col-meta { display: flex; flex-direction: column; gap: 0.4rem; min-width: 0; }

    .meta-chip {
      display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.8rem; color: var(--text-secondary); max-width: 100%;
    }
    .meta-chip span {
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .meta-chip svg { opacity: 0.6; flex-shrink: 0; }

    .col-action { display: flex; justify-content: flex-end; }

    .btn-view {
      padding: 0.5rem 1rem;
      background: transparent;
      border-radius: 6px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      border: 1px solid transparent;
      pointer-events: none;
      font-weight: 500;
    }
    .job-row:hover .btn-view { color: var(--text-primary); border-color: var(--border-subtle); }

    /* Sliding Drawer (Detail View) */
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
      opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 999;
    }
    .drawer-overlay.open { opacity: 1; pointer-events: auto; }

    .drawer {
      position: fixed; top: 0; right: -650px; width: 650px; max-width: 100vw; height: 100vh;
      background: var(--bg-base); box-shadow: -20px 0 50px rgba(0,0,0,0.3);
      z-index: 1000; transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease;
      display: flex; flex-direction: column; border-left: 1px solid var(--border-subtle);
    }
    .drawer.open { right: 0; }

    .drawer-header {
      padding: 2rem 2.5rem; border-bottom: 1px solid var(--border-subtle); position: relative; background: var(--bg-surface);
    }
    .close-btn {
      position: absolute; top: 1.5rem; right: 1.5rem; background: var(--bg-base); border: 1px solid var(--border-subtle);
      color: var(--text-secondary); cursor: pointer; padding: 0.6rem; border-radius: 8px;
      transition: all 0.2s ease; display: flex; align-items: center; justify-content: center;
    }
    .close-btn:hover { color: var(--text-primary); border-color: var(--text-primary); }

    .drawer-company { font-size: 0.95rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-tertiary); margin-bottom: 0.75rem; }
    .drawer-title { font-family: 'Newsreader', serif; font-size: 2.2rem; font-weight: 400; color: var(--text-primary); margin-bottom: 1.5rem; padding-right: 3rem; line-height: 1.1; letter-spacing: -0.02em; }

    .drawer-tags { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .drawer-tag { background: var(--bg-base); border: 1px solid var(--border-subtle); padding: 0.35rem 0.8rem; border-radius: 6px; font-size: 0.8rem; color: var(--text-secondary); font-weight: 500; }

    .drawer-content { padding: 2.5rem; overflow-y: auto; flex: 1; }
    .drawer-section-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-tertiary); margin-bottom: 1.25rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
    .ai-reasoning { font-family: 'Newsreader', serif; font-size: 1.15rem; line-height: 1.6; color: var(--text-primary); margin-bottom: 3rem; }

    .apply-link {
      display: inline-flex; align-items: center; gap: 0.5rem; background: var(--text-primary); color: var(--bg-base);
      text-decoration: none; padding: 0.8rem 1.5rem; border-radius: 8px; font-size: 0.95rem; font-weight: 500;
      transition: opacity 0.2s;
    }
    .apply-link:hover { opacity: 0.9; }
    
    #emptyState { padding: 5rem 1rem; text-align: center; color: var(--text-tertiary); font-family: 'Newsreader', serif; font-style: italic; font-size: 1.25rem; }

    /* ==========================================================================
       MOBILE RESPONSIVENESS OVERHAUL
       ========================================================================== */
    @media (max-width: 768px) {
      .main-header {
        padding: 1rem 1.25rem;
        flex-direction: column;
        align-items: stretch;
        gap: 1rem;
      }
      .header-left {
        justify-content: space-between;
      }
      h1 { font-size: 1.8rem; }
      .search-bar { max-width: 100%; }
      .main-content-inner { padding: 1.25rem; gap: 1.5rem; }
      .metrics { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
      
      /* Switch job list to a beautiful card stack on mobile */
      .job-list { background: transparent; border: none; overflow: visible; }
      .list-header { display: none; }
      
      .job-row {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding: 1.25rem;
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        margin-bottom: 1rem;
        gap: 0.75rem;
        max-width: 100%;
      }
      .job-row:last-child { margin-bottom: 0; border-bottom: 1px solid var(--border-subtle); }
      
      .col-score {
        position: absolute;
        top: 1.25rem;
        right: 1.25rem;
        background: var(--bg-base);
        padding: 0.25rem 0.6rem;
        border-radius: 6px;
        font-size: 0.85rem;
        border: 1px solid var(--border-subtle);
      }

      .col-job { position: relative; width: 100%; padding-right: 4rem; gap: 0.25rem; }
      .col-meta { flex-direction: row; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; max-width: 100%; overflow: hidden; }
      .col-action { display: none; } /* Hide view button on mobile card */

      .drawer-header { padding: 1.5rem 1.25rem; }
      .drawer-content { padding: 1.5rem 1.25rem; }
      .drawer-title { font-size: 1.6rem; margin-bottom: 1rem; }
    }

    @media (max-width: 480px) {
      .metrics { grid-template-columns: 1fr; }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body class="sidebar-collapsed">

  <!-- Mobile Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true" onclick="toggleSidebar()" style="z-index: 90;"></div>

  <!-- Left Navigation -->
  <nav class="nav-sidebar" id="sidebar" aria-label="Main Navigation">
    <div class="sidebar-header">
      <a href="#" class="brand">JobETL</a>
      <div class="sidebar-actions">
        <!-- Theme Toggle -->
        <button class="icon-btn" onclick="toggleTheme()" aria-label="Toggle Theme">
          <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
        <!-- Claude-style Sidebar Toggle -->
        <button class="icon-btn" onclick="toggleSidebar()" aria-label="Close Sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
        </button>
      </div>
    </div>

    <div class="sidebar-content">
      <div class="nav-group" role="group" aria-label="Intelligence Filters">
        <div class="nav-label">Intelligence</div>
        <button class="filter-item active" onclick="setFilter('matched', this)" aria-pressed="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
          Matched
        </button>
        <button class="filter-item" onclick="setFilter('all', this)" aria-pressed="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          All Evaluated
        </button>
        <button class="filter-item" onclick="setFilter('rejected', this)" aria-pressed="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          Rejected
        </button>
      </div>

      <div class="nav-group" role="group" aria-label="Source Filters" style="margin-top: 1rem;">
        <div class="nav-label">Sources</div>
        <div id="sourceFilterContainer" style="display: flex; flex-direction: column; gap: 0.2rem;">
          <!-- Dynamically populated -->
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main id="mainContent">
    <div class="main-header">
      <div class="header-left">
        <button class="icon-btn main-toggle-btn" onclick="toggleSidebar()" aria-label="Open Sidebar" aria-expanded="false" aria-controls="sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
        </button>
        <h1 id="mainTitle">Matched</h1>
      </div>
      <div style="display: flex; gap: 0.75rem; flex: 1; max-width: 480px;">
        <div style="position: relative;">
          <select id="sortSelect" aria-label="Sort options" style="height: 100%; background: var(--bg-surface); border: 1px solid var(--border-subtle); color: var(--text-primary); padding: 0.6rem 2rem 0.6rem 1rem; border-radius: 8px; font-size: 0.95rem; outline: none; cursor: pointer; appearance: none;">
            <option value="score">Sort by Score</option>
            <option value="date">Sort by Latest</option>
          </select>
          <svg style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--text-tertiary);" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
        <div class="search-bar" style="flex: 1; max-width: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="search" id="searchInput" placeholder="Search title or company..." aria-label="Search jobs" style="height: 100%;">
        </div>
      </div>
    </div>

    <div class="main-content-inner">
      <!-- Metrics Row -->
      <div class="metrics" aria-label="Key Metrics">
        <div class="metric-card">
          <div class="metric-label">Total Evaluated</div>
          <div class="metric-value" id="metric-total" aria-live="polite">-</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">High Quality</div>
          <div class="metric-value" id="metric-matched" style="color: var(--success);" aria-live="polite">-</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Average Score</div>
          <div class="metric-value" id="metric-avg" aria-live="polite">-</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Rejection Rate</div>
          <div class="metric-value" id="metric-reject" aria-live="polite">-</div>
        </div>
      </div>

      <!-- Data List -->
      <div class="job-list" id="jobListWrapper">
        <div class="list-header" aria-hidden="true">
          <div>Score</div>
          <div>Opportunity</div>
          <div>Details</div>
          <div></div>
        </div>
        <div id="jobListContainer" role="list" aria-live="polite">
          <div id="emptyState">Loading intelligence...</div>
        </div>
      </div>
    </div>
  </main>

  <!-- Sliding Drawer for Details -->
  <div class="drawer-overlay" id="drawerOverlay" aria-hidden="true" onclick="closeDrawer()"></div>
  <div class="drawer" id="detailDrawer" role="dialog" aria-modal="true" aria-labelledby="drawTitle">
    <div class="drawer-header">
      <button class="close-btn" id="drawerCloseBtn" onclick="closeDrawer()" aria-label="Close details panel">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <div class="drawer-company" id="drawCompany">Company</div>
      <h2 class="drawer-title" id="drawTitle">Title</h2>
      <div class="drawer-tags">
        <div class="drawer-tag" id="drawScore" style="color: var(--success);">95%</div>
        <div class="drawer-tag" id="drawSource">Source</div>
        <div class="drawer-tag hidden" id="drawLocation">Loc</div>
        <div class="drawer-tag hidden" id="drawSalary">Sal</div>
      </div>
    </div>
    <div class="drawer-content">
      <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 2rem;">
        <input type="checkbox" id="drawApplied" style="width: 1.2rem; height: 1.2rem; accent-color: var(--accent); cursor: pointer;">
        <label for="drawApplied" style="font-weight: 500; font-size: 1rem; cursor: pointer; color: var(--text-primary);">CV Sent / Applied</label>
      </div>
      <div class="drawer-section-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
        Claude Analysis
      </div>
      <div class="ai-reasoning" id="drawReason">Reasoning</div>
      <a href="#" target="_blank" class="apply-link" id="drawUrl">
        View Original Posting
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      </a>
    </div>
  </div>

  <script>
    // Theme Switcher Logic
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('jobetl-theme', theme);
      
      const icon = document.getElementById('themeIcon');
      if (theme === 'light') {
        icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>'; // Moon
      } else {
        icon.innerHTML = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>'; // Sun
      }
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      applyTheme(newTheme);
    }

    // Initialize Theme
    const savedTheme = localStorage.getItem('jobetl-theme');
    const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
    if (savedTheme) {
      applyTheme(savedTheme);
    } else if (prefersLight) {
      applyTheme('light');
    } else {
      applyTheme('dark');
    }

    let allJobs = [];
    let selectedSources = new Set();
    let currentFilter = 'matched';
    let currentSort = 'score';
    const thresholdPercent = Number('__MATCH_THRESHOLD__') || 78;

    function toggleSidebar() {
      const isCollapsed = document.body.classList.toggle('sidebar-collapsed');
      
      const overlay = document.getElementById('sidebarOverlay');
      if (window.innerWidth <= 1024) {
        if (!isCollapsed) {
          overlay.style.display = 'block';
          // Force reflow
          void overlay.offsetWidth;
          overlay.style.opacity = '1';
        } else {
          overlay.style.opacity = '0';
          setTimeout(() => {
            if(document.body.classList.contains('sidebar-collapsed')) {
              overlay.style.display = 'none';
            }
          }, 300);
        }
      }
    }

    async function fetchJobs() {
      try {
        const res = await fetch('/api/jobs');
        if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
        allJobs = await res.json();
        populateSourceFilters();
      } catch (err) {
        allJobs = [];
        document.getElementById('emptyState').innerText = 'Failed to load jobs: ' + err.message;
      }
      updateMetrics();
      renderList();
    }

    function updateMetrics() {
      const total = allJobs.length;
      const matched = allJobs.filter(j => j.status === 'matched').length;
      const rejected = allJobs.filter(j => j.status === 'rejected').length;
      
      let sumScore = 0; let scoreCount = 0;
      allJobs.forEach(j => {
        if (j.matchScore) { sumScore += j.matchScore; scoreCount++; }
      });
      
      const avg = scoreCount > 0 ? ((sumScore / scoreCount) * 100).toFixed(0) + '%' : '-';
      const rejectRate = total > 0 ? ((rejected / total) * 100).toFixed(0) + '%' : '-';

      document.getElementById('metric-total').innerText = total;
      document.getElementById('metric-matched').innerText = matched;
      document.getElementById('metric-avg').innerText = avg;
      document.getElementById('metric-reject').innerText = rejectRate;
    }

    function setFilter(status, el) {
      currentFilter = status;
      document.querySelectorAll('.filter-item').forEach(node => {
        node.classList.remove('active');
        node.setAttribute('aria-pressed', 'false');
      });
      el.classList.add('active');
      el.setAttribute('aria-pressed', 'true');
      
      const titleMap = { 'matched': 'Matched', 'all': 'All Evaluated', 'rejected': 'Rejected' };
      document.getElementById('mainTitle').innerText = titleMap[status] || 'Dashboard';
      
      if (window.innerWidth <= 1024) toggleSidebar();
      renderList();
    }

    function populateSourceFilters() {
      const container = document.getElementById('sourceFilterContainer');
      const sources = [...new Set(allJobs.map(j => j.source))].filter(Boolean);
      selectedSources = new Set(sources);
      
      container.innerHTML = '';
      sources.forEach(source => {
        const label = document.createElement('label');
        label.className = 'source-filter-label';
        
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'source-filter-checkbox';
        checkbox.value = source;
        checkbox.checked = true;
        checkbox.onchange = (e) => toggleSource(source, e.target.checked);
        
        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(' ' + source));
        container.appendChild(label);
      });
    }

    function toggleSource(source, isChecked) {
      if (isChecked) selectedSources.add(source);
      else selectedSources.delete(source);
      renderList();
    }

    function renderList() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const container = document.getElementById('jobListContainer');
      container.innerHTML = '';

      let filtered = allJobs.filter(job => {
        if (currentFilter !== 'all' && job.status !== currentFilter) return false;
        if (job.source && !selectedSources.has(job.source)) return false;
        if (search) {
          return (job.title ?? '').toLowerCase().includes(search) || (job.company ?? '').toLowerCase().includes(search);
        }
        return true;
      });

      if (currentSort === 'date') {
        filtered.sort((a, b) => {
          return new Date(b.createdAt) - new Date(a.createdAt);
        });
      } else {
        filtered.sort((a, b) => (b.matchScore || 0) - (a.matchScore || 0));
      }

      if (filtered.length === 0) {
        container.innerHTML = '<div id="emptyState">No opportunities match this criteria.</div>';
        return;
      }

      filtered.forEach(job => {
        const score = job.matchScore ? (job.matchScore * 100).toFixed(0) : 0;
        const scoreClass = score >= thresholdPercent ? 'score-high' : '';
        
        const row = document.createElement('button');
        row.className = 'job-row' + (job.isApplied ? ' applied' : '');
        row.setAttribute('role', 'listitem');
        row.onclick = () => openDrawer(job.externalId);
        
        const colScore = document.createElement('div');
        colScore.className = `col-score ${scoreClass}`;
        colScore.textContent = `${score}%`;
        row.appendChild(colScore);

        const colJob = document.createElement('div');
        colJob.className = 'col-job';
        const title = document.createElement('div');
        title.className = 'job-title';
        title.textContent = job.title;

        // Freshness Indicator Badges
        const now = new Date();
        now.setHours(0,0,0,0);
        
        const createdDate = new Date(job.createdAt);
        createdDate.setHours(0,0,0,0);
        
        const diffTime = now - createdDate;
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
        
        if (diffDays >= 0 && diffDays <= 1) {
          const badge = document.createElement('span');
          badge.className = 'badge-applied';
          badge.style.color = 'var(--danger)';
          badge.style.borderColor = 'var(--danger)';
          badge.innerHTML = '🔥 Hot';
          title.appendChild(badge);
        } else if (diffDays > 1 && diffDays <= 3) {
          const badge = document.createElement('span');
          badge.className = 'badge-applied';
          badge.style.color = 'var(--success)';
          badge.style.borderColor = 'var(--success)';
          badge.innerHTML = '🟢 New';
          title.appendChild(badge);
        }

        if (job.isApplied) {
          const badge = document.createElement('span');
          badge.className = 'badge-applied';
          badge.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg> Applied';
          title.appendChild(badge);
        }
        const company = document.createElement('div');
        company.className = 'job-company';
        company.textContent = job.company;
        colJob.appendChild(title); colJob.appendChild(company);
        row.appendChild(colJob);

        const colMeta = document.createElement('div');
        colMeta.className = 'col-meta';
        
        const dateChip = document.createElement('div');
        dateChip.className = 'meta-chip';
        dateChip.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg> `;
        const dateSpan = document.createElement('span');
        
        const d = new Date(job.createdAt);
        dateSpan.textContent = isNaN(d.getTime()) ? 'Unknown' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        
        dateChip.appendChild(dateSpan);
        colMeta.appendChild(dateChip);

        if (job.location) {
          const loc = document.createElement('div');
          loc.className = 'meta-chip';
          loc.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> `;
          const locSpan = document.createElement('span');
          locSpan.textContent = job.location;
          loc.appendChild(locSpan);
          colMeta.appendChild(loc);
        }
        if (job.salaryText) {
          const sal = document.createElement('div');
          sal.className = 'meta-chip';
          sal.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> `;
          const salSpan = document.createElement('span');
          salSpan.textContent = job.salaryText;
          sal.appendChild(salSpan);
          colMeta.appendChild(sal);
        }
        row.appendChild(colMeta);

        const colAction = document.createElement('div');
        colAction.className = 'col-action';
        const btn = document.createElement('div');
        btn.className = 'btn-view';
        btn.textContent = 'View';
        colAction.appendChild(btn);
        row.appendChild(colAction);

        container.appendChild(row);
      });
    }

    function openDrawer(id) {
      const job = allJobs.find(j => j.externalId === id);
      if (!job) return;

      document.getElementById('drawCompany').textContent = job.company;
      document.getElementById('drawTitle').textContent = job.title;
      
      const score = job.matchScore ? (job.matchScore * 100).toFixed(0) : 0;
      const scoreEl = document.getElementById('drawScore');
      scoreEl.textContent = `${score}%`;
      scoreEl.style.color = score >= thresholdPercent ? 'var(--success)' : 'var(--text-secondary)';

      document.getElementById('drawSource').textContent = job.source;
      
      const locEl = document.getElementById('drawLocation');
      if (job.location) { locEl.textContent = job.location; locEl.style.display = 'block'; }
      else { locEl.style.display = 'none'; }

      const salEl = document.getElementById('drawSalary');
      if (job.salaryText) { salEl.textContent = job.salaryText; salEl.style.display = 'block'; }
      else { salEl.style.display = 'none'; }

      document.getElementById('drawReason').textContent = job.matchReason || 'No reasoning provided.';

      const appliedCheckbox = document.getElementById('drawApplied');
      appliedCheckbox.checked = job.isApplied === true;
      appliedCheckbox.onchange = async (e) => {
        const priorState = job.isApplied;
        const isApplied = e.target.checked;
        job.isApplied = isApplied;
        e.target.disabled = true;
        renderList();
        try {
          const res = await fetch(`/api/jobs/${encodeURIComponent(job.externalId)}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ isApplied })
          });
          if (!res.ok) throw new Error(`Server returned ${res.status}`);
        } catch (err) {
          console.error("Failed to update applied status", err);
          job.isApplied = priorState;
          e.target.checked = priorState === true;
          renderList();
        } finally {
          e.target.disabled = false;
        }
      };
      
      let safeUrl = '#';
      try {
        const parsedUrl = new URL(job.url);
        if (parsedUrl.protocol === 'http:' || parsedUrl.protocol === 'https:') {
          safeUrl = job.url;
        }
      } catch (e) {
        // Invalid URL
      }
      document.getElementById('drawUrl').href = safeUrl;

      document.getElementById('drawerOverlay').classList.add('open');
      document.getElementById('detailDrawer').classList.add('open');
      setTimeout(() => document.getElementById('drawerCloseBtn').focus(), 100);
    }

    function closeDrawer() {
      document.getElementById('drawerOverlay').classList.remove('open');
      document.getElementById('detailDrawer').classList.remove('open');
    }

    document.getElementById('searchInput').addEventListener('input', renderList);
    
    document.getElementById('sortSelect').addEventListener('change', (e) => {
      currentSort = e.target.value;
      renderList();
    });
    
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (document.getElementById('detailDrawer').classList.contains('open')) closeDrawer();
        else if (!document.body.classList.contains('sidebar-collapsed') && window.innerWidth <= 1024) toggleSidebar();
      }
    });

    fetchJobs();
  </script>
</body>
</html>
